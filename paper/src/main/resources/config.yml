logging:
  # 0 = nothing, 1 = everything, 2 = failed + destruction/automation, 3 = destruction/automation only
  level: 1
keys:
  # false = ominous trial keys only, true = ominous + normal trial keys
  allow-normal: false
  normal:
    # true = opening an armed normal-key lock consumes one normal trial key and unlocks the container
    # false = normal-key locks stay persistent (ominous-style) and are not consumed/unlocked
    consume-on-unlock: true
messages:
  # true = send the acting player lock/unlock status chat messages
  verbose-lock-actions: false
recovery:
  paid-unlock:
    # requires Vault + an economy provider (e.g., EssentialsX Economy via Vault)
    enabled: false
    # locksmith service fee to recover a lock when the owner is also the last player who opened it
    cost: 5000.0
storage:
  # Storage backend: yaml (default, backward compatible), sqlite, or mysql
  type: yaml
  sqlite:
    # SQLite database file path. Relative paths resolve from the server root folder.
    file: OminousChestLock/data.db
  mysql:
    host: localhost
    port: 3306
    database: ominouschestlock
    username: root
    password: change_me
    parameters: "?useSSL=false&autoReconnect=true"
    pool:
      maximumPoolSize: 10
      minimumIdle: 2
      connectionTimeoutMs: 30000
lockpicks:
  # true = allow lock pick crafting and usage
  enabled: true
  # random attempt limit before lockout
  limit:
    min: 1
    max: 20
  # lockout scope: "chest" = shared for all players, "player" = per-player lockout tracking
  lockout-scope: chest
  rusty:
    open-chance: 0.05
    normal-key-chance: 0.10
    break-chance: 0.88
    damage: 1.0
  normal:
    open-chance: 0.10
    normal-key-chance: 0.20
    break-chance: 0.33
    damage: 2.0
  silence:
    open-chance: 0.50
    break-chance: 0.05
    damage: 4.0
    # time until over-limit penalty resets
    penalty-reset-minutes: 60
  minigame:
    enabled: true
    trial:
      pins: 4
      depths: 4
      assist-eliminate-one: true
      regenerate-on-attempt: false
    ominous:
      pins: 6
      depths: 5
      regenerate-on-attempt: true
    session-timeout-seconds: 90
    bossbar:
      enabled: true
      animate-ticks: 12
      peak-hold-ticks: 20
      snapback-delay-ticks: 20
    visual-feedback:
      enabled: true
      rename-inventory-title: true
    ui:
      pin-icon: end_rod
    sounds:
      click-per-correct-pin: true
    security:
      require-holding-pick: true
    salt: "change-me"
    salt-version: 1
